version: '3.8'

services:
  relay:
    image: hyvor/relay:0.0.45
    hostname: relay-server
    restart: unless-stopped

    expose:
      - "80"

    ports:
      - "25:25"
      - "587:587"
      - "53:53/tcp"
      - "53:53/udp"

    environment:
      APP_ENV: prod
      LOG_LEVEL: info
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/relay?serverVersion=16&charset=utf8"
      WEB_URL: "http://${WEB_DOMAIN}"
      INSTANCE_DOMAIN: "${INSTANCE_DOMAIN}"
      APP_SECRET: "${APP_SECRET}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r 'exit(@file_get_contents(\"http://localhost/api/health\") === false ? 1 : 0);'"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: relay

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relay"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
