version: '3.8'

services:
  relay:
    image: hyvor/relay:latest
    restart: unless-stopped
    # network_mode: host DIHAPUS agar tidak bentrok dengan Traefik/Coolify
    ports:
      # Port untuk SMTP (Mengirim dan menerima email)
      - "25:25"
      - "587:587"
      - "465:465"
      # Port untuk in-built DNS Server Hyvor Relay
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      # Koneksi Database
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/relay
      
      # PENTING: Gunakan http:// agar Hyvor tidak mencoba mengatur SSL sendiri
      - WEB_URL=http://${WEB_DOMAIN} 
      - INSTANCE_DOMAIN=${INSTANCE_DOMAIN}
      
      # Keamanan
      - APP_SECRET=${APP_SECRET}
      
      # Konfigurasi Login OIDC (Wajib ada)
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
    depends_on:
      - postgres
    volumes:
      - relay_data:/var/lib/relay

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=relay
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  relay_data:
  postgres_data:
